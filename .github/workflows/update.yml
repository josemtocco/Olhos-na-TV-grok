name: Atualizar playlist

on:
  workflow_dispatch:
  schedule:
    # A cada 6 horas (UTC)
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: playlist-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Testes
        run: python -m unittest -v

      - name: Coletar canais e gerar M3U
        run: python scraper.py --verbose

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u categoria-*.m3u channels.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração na playlist."
          else
            git commit -m "chore: atualizar playlist M3U"
            git push
          fi
